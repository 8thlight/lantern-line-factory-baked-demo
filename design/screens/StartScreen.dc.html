<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Line start screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 640px; height: 400px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #f4efe1">
  <dc-import name="Board" scene="quiet" dim="0.62" hint-size="640px,400px"></dc-import>

  <div style="position: absolute; left: 0; right: 0; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <svg width="64" height="88" viewBox="-40 -48 80 96" aria-hidden="true" style="overflow: visible">
      <circle cx="0" cy="-2" r="46" fill="#ffd27a" fill-opacity="0.16"></circle>
      <circle cx="0" cy="-2" r="30" fill="#ffd27a" fill-opacity="0.18"></circle>
      <path d="M0 -48 V-34" stroke="#7a5b31" stroke-width="2.5"></path>
      <rect x="-14" y="-35" width="28" height="7" rx="3.5" fill="#4a3720"></rect>
      <rect x="-20" y="-29" width="40" height="44" rx="17" fill="#e8a83a"></rect>
      <rect x="-15" y="-24" width="30" height="34" rx="13" fill="#f6c95c"></rect>
      <ellipse cx="0" cy="-7" rx="8" ry="11" fill="#fff4c9"></ellipse>
      <path d="M-8 -28 V14 M8 -28 V14" stroke="#b97a22" stroke-opacity="0.45" stroke-width="1.6"></path>
      <rect x="-12" y="14" width="24" height="7" rx="3.5" fill="#4a3720"></rect>
      <path d="M0 21 V33" stroke="#d9534f" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <h1 style="margin: 4px 0 0; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; color: #f6c95c; text-shadow: 0 0 24px rgba(242, 193, 78, 0.45)">Lantern Line</h1>
    <p style="margin: 0; font-size: 15px; color: #d8d2c2">Light the lanterns. Stop the ghosts before they reach the gate.</p>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 236px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 184px; height: 48px; border: 0; border-radius: 10px; background: #f2c14e; color: #12241c; font: 800 17px Inter, system-ui, sans-serif; box-shadow: 0 6px 20px rgba(242, 193, 78, 0.35)">
      <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.6 L10.4 6 L3 10.4 Z" fill="#12241c"></path></svg>
      Start
    </button>
    <span style="font-size: 12px; color: #b8c4b0">or press Enter or Space</span>
  </div>

  <div style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; width: 170px; padding: 8px 10px; border-radius: 10px; background: rgba(10, 22, 16, 0.72); border: 1px solid rgba(244, 239, 225, 0.08); font-size: 11.5px; line-height: 1.35; color: #d8d2c2">
      <span style="flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(242, 193, 78, 0.18); color: #f2c14e; font-weight: 800">1</span>
      <span>Hang lanterns on the grass beside the path</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; width: 170px; padding: 8px 10px; border-radius: 10px; background: rgba(10, 22, 16, 0.72); border: 1px solid rgba(244, 239, 225, 0.08); font-size: 11.5px; line-height: 1.35; color: #d8d2c2">
      <span style="flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(195, 168, 255, 0.18); color: #c3a8ff; font-weight: 800">2</span>
      <span>Each one shines on the nearest ghost in range</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; width: 170px; padding: 8px 10px; border-radius: 10px; background: rgba(10, 22, 16, 0.72); border: 1px solid rgba(244, 239, 225, 0.08); font-size: 11.5px; line-height: 1.35; color: #d8d2c2">
      <span style="flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(230, 90, 90, 0.18); color: #ff8f8f; font-weight: 800">3</span>
      <span>A ghost that reaches the gate costs a life</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
