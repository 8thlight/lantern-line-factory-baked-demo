# This line's charter, written by hydraflow init (printer.line_charter). Its purpose
# and goal are the operator's words for this line; the rest is derived from the
# kernel's charter, which hydraflow upgrade derives again, keeping both.
schema_version: 1
purpose:
  product: A HydraFlow demo, seeded by deploy/demo/github_seed.py
  stated_by: operator
  stated_on: 2026-11-18
goal:
  stated_by: operator
  stated_on: 2026-11-18
  statement: Build the issues released with the hydraflow label
  clauses: []
promotion:
  cadence: 3h
  scheduled: 3h
  workflow: .github/workflows/release-cut.yml
  stall_after_cuts: 16
articles:
  standards:
  - console_alignment
  - ports_and_adapters
  - domain_entities
  - adr_enforcement
  - ci_is_configured
  - hygiene
  - offline_verdicts
  - testing
  - overflow_is_declared
  - proxy_is_the_only_path
  - decision_seam
  - hooks_wired
  - artifact_chain
  - ubiquitous_language
  - scope
  - dark_factory
  - code_craft
  - sandbox_trust_boundary
  - test_lock
  - evidence_before_verdict
  - fail_closed
  - design_review
  - build_evidence
  - no_second_copy
  - house_method
  - defect_route
  - api_contract
  - knowledge
  - the_line_keeps_moving
  - escape_ledger
  - line_contract
  planned_standards: []
  milestones_complete: []
  assurance: internal
  awaiting_standards: []
  local: []
actors:
  path: agents/
  grants:
    merge: []
    sign:
    - review_loop
    spend: []
gate_polarity:
  permissive_when_grown:
  - actors.grants.merge
  - actors.grants.sign
  - actors.grants.spend
operator:
  intervention_threshold:
  - id: separate_runs
    runs: 3
    verdict: structural
  - id: same_place
    at_one_place: 2
    verdict: policy_change
  - id: first_sighting
    runs: 1
    verdict: retry
  defect_route:
  - id: repair
    mechanism: src/printer/repair_runtime.py:production_repair_sweep
    because: the factory fixes forward, keeping the merged work — an ejected print passed its own checks and merged through its own review, and what failed is the combination
  - id: supervisor
    mechanism: src/printer/defect_route.py:raised_to
    because: the rung below drafts `class:fix`, and a repair is refused at ratify the moment it reaches the enforcement, so this is the first rung whose record may be ABOUT the check that judged the tree
      rather than only about the tree — the seat `agents/supervisor.md` describes, asked the question its own "When the enforcement is what is wrong" section holds and `stages/repair.yaml` may not act on
  - id: operator
    mechanism: src/printer/defect_route.py:exhausted_approver
    bounded_by: defaults.intervention_budget.per_day
    because: the human in the loop, last, and only when the seat above cannot — the one rung that is a person, named in `.hydraflow/policy.yaml` at `defect_route.exhausted_requires` and bound to the condition
      below
  hitl_policy:
  - condition: rollback
    raised_by: rollback.approver
    because: restoring a previous release changes the deployed world outside the ordinary print chain, so the emergency control requires the operator whose signed row it records
  - condition: defect_route_exhausted
    raised_by: defect_route.exhausted_requires
    because: 'the defect route above ends in a person and the rungs before it do not: a red cumulative tree is repaired forward, then raised to the supervising seat, and only a route that both of those
      have exhausted reaches the operator. ADR-0020 took the click off every gate, so this one carries `.hydraflow/loops.yaml`''s `defaults.intervention_budget.per_day` as its floor — it stays an exception
      because it is bounded, not because it is rare'
  - condition: secret_in_stream
    raised_by: brake.conditions.secret_in_stream
    because: a credential that reached a stage's stream may already be on its way out, and stopping the line is the one act that cannot make that worse
  - condition: destructive_command
    raised_by: brake.conditions.destructive_command
    because: a command that destroys work outside a print's branch is the harm the hooks refuse, and a person is the one who says the line may go on after it
  - condition: spend_over_cap
    raised_by: brake.conditions.spend_over_cap
    because: spend past a declared cap is money the operator did not release, and only he can release more
artifacts:
  required:
  - agents
  - prints
product_standards:
  schema_version: 1
  layers:
  - universal
  - language_pack
  - domain
  available:
  - universal
  - python_service
  - web_app
  - multi_tenant
  - rbac
  - deployable
  - experience_design
  - model_seats
measures:
  schema_version: 1
  epoch:
    at: 2026-10-03 23:24:09+00:00
    statement: 'the instant every rate below is read from: the first merge after the pull request backlog was cleared by hand, which is the first commit of the regime these rates are about. Rows before
      it are history and stay readable; they are not averaged into a measurement of the factory as it runs now'
  denominator:
    id: accepted_production_artifact
    statement: 'one merge of a print''s work into a target''s declared integration branch: one artifact this factory produced that someone other than its builder took'
    admits:
    - id: merged_not_merely_closed
      statement: the pull request's own state is merged, and a pull request closed without merging admits nothing
    - id: into_the_declared_integration_branch
      statement: the merge's base is the branch the target declares its prints merge to
    - id: one_per_merge_never_one_per_print
      statement: each merge admits exactly one artifact, and two merges of one print admit two
    hand_cut_branches_are_admitted: true
  divisors:
  - id: every_accepted_artifact
    statement: every merge the three clauses above admit, whoever cut the branch
  - id: the_accepted_artifacts_this_printer_ran
    statement: the subset this printer itself ran, which the ledger knows by a print id. A branch cut by hand is an accepted production artifact and is not a run of this factory, so a rate about the factory's
      own behaviour taken over it reads a person's work as the machine's
  - id: every_accepted_amendment
    statement: 'every merge the three clauses above admit that the amendment ledger reads as having reached the law: a landing whose diff touched the mandate class its base, or the line today, declares'
  - id: the_accepted_amendments_this_printer_ran
    statement: the subset of those this printer itself ran, which the ledger knows by a print id. A session's own merge writes no cost row, so a cost taken over it would read as free
  sources:
  - id: ledger_transitions
    carried: true
    statement: the ledger's state rows — a halt, and the resume that ended it. `src/printer/state.py` is the one writer; an ordinary advance writes nothing, so no row for a print means no halt for it rather
      than an absence of evidence
  - id: ledger_cost_rows
    carried: true
    statement: the ledger's wide cost rows, one per model call, read per print. A print built outside the proxy writes none, which is why every rate over this source reports how many of the window's artifacts
      it could speak for
  - id: amendment_ledger
    carried: true
    statement: every landing on the integration line that reached the law, with the day its seed bead was filed and who filed it (`src/printer/amendment_ledger.py`, the rows `make amendments` prints), read
      from the line's own history and the bead store. A store that does not answer leaves every row's origin unknown, and the latency over such rows refuses by name rather than measuring from no ask
  - id: operator_clock
    carried: false
    statement: 'a person''s own clock: how long an operator spent on one act, not how long the line waited for them'
    absent_because: nothing records when a person started or finished an act. The transition rows carry when the line stopped and when it moved again, which is the line's wait
    derivable_when: 'the operator channel''s rows (`src/printer/operator_events.py`) carry a started and an ended instant per act, and this row reads `carried: true`'
  - id: escape_ledger
    carried: true
    statement: every escape the committed ledger records (.hydraflow/escapes.yaml, hand-entered rows included at the operator's ruling of 2026-11-10) and every row the escape sweep files from a revert,
      held or OWED, attributed to a merge by the commit the defect entered with. A caretaker finding, a red release cut and a red nightly run are not swept yet (bead hydraflow-te25w), so the rate counts
      those only when a row was written for them by hand
  rates:
  - id: runs_without_operator_rescue
    statement: the share of accepted production artifacts whose print the ledger recorded no operator resume for and whose merge the factory made itself — the factory finishing on its own
    numerator: accepted artifacts with no halt a person ended, whose merged row carries the factory's Landed-by trailer for that pull request
    reads: ledger_transitions
    over: the_accepted_artifacts_this_printer_ran
    harmful: down
  - id: retries_per_accepted_artifact
    statement: how much work the line had to run a second time to produce one accepted artifact — a stage re-running after its own refusal, and never the printer putting back a halt its own stop wrote
    numerator: halts in the window that ended in a resume, less those whose reason `restart_bookkeeping` below declares is the printer's own restart accounting
    reads: ledger_transitions
    over: the_accepted_artifacts_this_printer_ran
    harmful: up
    restart_bookkeeping:
    - halt_reason: power_off
      statement: 'the printer was stopped, so every print in flight took a halt it did not earn and the next pass put it back. `printer.power_cycle.PRINTERS_OWN_HALTS` names this reason and predecessor_not_ready
        and no other (a red base is taken back on its own condition, the last row here): a retry cap, a scope breach, a crash and the deployment quarantine each name something a person weighs before the
        print moves again, and work run again after one of those IS re-work'
    - halt_reason: predecessor_not_ready
      statement: the chain gate refused a stage by name before it bought any work, because the artifact it reads is not on the branch with the bytes the bay holds (bead `hydraflow-yb5w`). The halt is the
        printer's own and the next pass puts it back into the stage that owes the artifact, so the put-back is bookkeeping and not a retry of the refused stage
    - halt_reason: base_red
      statement: the verify lane went red and every test it named was red on the integration head as well (bead `hydraflow-a6gn6`), so the red was the base's and the print was charged nothing. The printer
        puts it back once the base has moved, so the put-back is the base being asked again and not a retry of the print's work
    - halt_reason: not_approved
      statement: print_steward parked a print nothing had approved yet (bead `hydraflow-10k1n`) and resumed it once the approval landed (bead `hydraflow-4b3ii`). No stage ran before the park, so the resume
        starts the work for the first time and is not a retry of it
  - id: regression_escape_rate
    statement: how many defects per accepted artifact escaped the per-print loop and were found after the merge
    numerator: escape rows attributed to a print that landed in the window
    reads: escape_ledger
    over: every_accepted_artifact
    harmful: up
  - id: operator_minutes_per_accepted_change
    statement: the minutes of a person's attention one accepted artifact cost
    numerator: the minutes a person spent on the acts this artifact needed of them
    reads: operator_clock
    over: every_accepted_artifact
    harmful: up
  - id: cost_per_accepted_change
    statement: what one accepted artifact cost in model spend, through the proxy that is the only path out
    numerator: the summed usd of every ledger row of every print that landed in the window
    reads: ledger_cost_rows
    over: the_accepted_artifacts_this_printer_ran
    harmful: up
  - id: cross_model_variance
    statement: how much the cost of one accepted artifact depends on which model built it — the spread, across models, of cost per accepted artifact
    numerator: cost per accepted artifact, taken once per model the window used
    reads: ledger_cost_rows
    over: the_accepted_artifacts_this_printer_ran
    needs_models: 2
    keyed_by:
    - model
    - harness
    - prompt_version
    harmful: up
  - id: promotion_latency_days
    statement: 'how long an observation takes to become enforced law: the median days from an amendment''s seed bead being filed to its landing'
    numerator: the days from each counted amendment's seed bead to its landing, as a median
    reads: amendment_ledger
    over: every_accepted_amendment
    harmful: up
  - id: cost_per_amendment
    statement: 'what one change to the law cost in model spend: the summed usd of the ledger rows of every print that reached the law in the window, over how many there were'
    numerator: the summed usd of every ledger row of every amendment this printer ran
    reads: ledger_cost_rows
    over: the_accepted_amendments_this_printer_ran
    harmful: up
